# Thaumoctopus 默认 profile 的补丁层，在所有 bundle 层之后应用。
# Phase 1：第一方品牌插件，占住侧栏品牌 slot。
# Workbench（Phase 2）与 Platform Bridge（Phase 3）的挂载项随后续阶段添加。
- insert:
    - id: thaumoctopus-brand
      name: '@thaumoctopus/brand'
    - id: thaumoctopus-workbench
      name: '@thaumoctopus/workbench'

# 屏蔽 DSH 自带的 DeepSeek 引导：账号/充值欢迎窗（桌面壳）与浏览器端的
# "添加 API Key"首启弹窗。Thaumoctopus 的账号体系接入前，这些引导对产品
# 无意义。patch 会整体替换目标行的 config，未列出的字段回落到 schema 默认值。
- id: ui-settings-account
  config:
    step: done
    completion: skipped
- id: ui-settings-models
  config:
    credentialOnboarding: false
